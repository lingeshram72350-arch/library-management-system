<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librarian Control Portal Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: #090d16;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .glow-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
        }
        .glow-1 { background: #2563eb; top: -50px; left: -50px; }
        .glow-2 { background: #f59e0b; bottom: -50px; right: -50px; }

        .login-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
        }
        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }
        .back-link:hover { color: #f59e0b; }

        .badge {
            display: inline-block;
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(37, 99, 235, 0.4);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .login-card h2 { color: white; font-size: 22px; font-weight: bold; }
        .login-card p { color: #94a3b8; font-size: 12px; margin-top: 4px; margin-bottom: 25px; }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }
        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 42px;
            background: rgba(2, 6, 23, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: white;
            font-size: 13px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.4);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.3);
            margin-top: 10px;
        }
        .btn-submit:hover { background: #1d4ed8; }

        .alert-box {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>

    <div class="login-card">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Student Portal</a>
        <br>
        <span class="badge"><i class="fa-solid fa-shield-halved"></i> SECURE GATEWAY</span>
        <h2>Librarian Control Portal</h2>
        <p>Enter administrative credentials to unlock library dashboard</p>

        <div id="loginAlert" class="alert-box" style="display: none;"></div>

        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="adminUsername" required placeholder="Admin Username">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="adminPassword" required placeholder="Password">
            </div>

            <button type="submit" class="btn-submit">Unlock Dashboard <i class="fa-solid fa-bolt"></i></button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
